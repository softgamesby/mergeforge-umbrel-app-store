<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101923"/>
      <stop offset="1" stop-color="#03070b"/>
    </linearGradient>

    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.30" stop-color="#e8fbff"/>
      <stop offset="0.58" stop-color="#31d7f4"/>
      <stop offset="1" stop-color="#0874dc"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#18d9f4"/>
      <stop offset="1" stop-color="#00aee8"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- dark rounded launcher tile -->
  <rect x="10" y="10" width="492" height="492" rx="96" fill="url(#bg)"/>
  <rect x="11" y="11" width="490" height="490" rx="95"
        fill="none" stroke="#182737" stroke-width="2"/>

  <!-- forge / mountain peak -->
  <path d="M198 154
           L220 132
           L231 144
           L257 99
           L304 159
           L290 174
           L266 145
           L251 176
           L232 141
           L214 163 Z"
        fill="url(#metal)"/>

  <!-- MergeForge M -->
  <path d="M92 119
           L92 319
           L146 302
           L146 210
           L256 308
           L366 210
           L366 302
           L420 319
           L420 119
           L256 260 Z"
        fill="url(#metal)"/>

  <!-- inner depth -->
  <path d="M146 210
           L177 237
           L177 287
           L146 302 Z"
        fill="#075a9a" opacity=".58"/>

  <path d="M366 210
           L335 237
           L335 287
           L366 302 Z"
        fill="#075a9a" opacity=".58"/>

  <!-- forge horizon -->
  <path d="M62 340 Q256 292 450 340"
        fill="none"
        stroke="url(#cyan)"
        stroke-width="7"
        stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- wordmark -->
  <text x="84" y="401"
        font-family="Arial, Helvetica, sans-serif"
        font-size="41"
        font-weight="700"
        letter-spacing="5"
        fill="#f5f8fb">MERGE</text>

  <text x="268" y="401"
        font-family="Arial, Helvetica, sans-serif"
        font-size="41"
        font-weight="700"
        letter-spacing="5"
        fill="url(#cyan)">FORGE</text>

  <!-- LTC + DOGE -->
  <path d="M88 432 H142 M370 432 H424"
        stroke="#9cc7e1"
        stroke-width="2"/>

  <text x="256" y="442"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        letter-spacing="8"
        fill="#a8d4ee">LTC + DOGE</text>
</svg>
