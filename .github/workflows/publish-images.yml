name: Publish MergeForge Images

on:
  workflow_dispatch:
    inputs:
      component:
        description: "Image to publish"
        required: true
        default: "web"
        type: choice
        options:
          - web
          - c2pool
          - litecoin
          - dogecoin
          - all

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: web
            context: mergeforge-ltc-doge/web
            image: ghcr.io/softgamesby/mergeforge-web
            tag: "0.1.1"

          - name: c2pool
            context: mergeforge-ltc-doge/c2pool
            image: ghcr.io/softgamesby/mergeforge-c2pool
            tag: "0.1.0"

          - name: litecoin
            context: mergeforge-ltc-doge/litecoin
            image: ghcr.io/softgamesby/mergeforge-litecoin
            tag: "0.21.5.8"

          - name: dogecoin
            context: mergeforge-ltc-doge/dogecoin
            image: ghcr.io/softgamesby/mergeforge-dogecoin
            tag: "1.14.9"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.name }}
        if: ${{ inputs.component == 'all' || inputs.component == matrix.name }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ matrix.image }}:${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Report manifest digest
        if: ${{ inputs.component == 'all' || inputs.component == matrix.name }}
        run: |
          echo "${{ matrix.image }}:${{ matrix.tag }}"
          echo "digest=${{ steps.build.outputs.digest }}"
