<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.45" stop-color="#b8c7d9"/>
      <stop offset="1" stop-color="#52e3ff"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#18c7d8"/>
      <stop offset="1" stop-color="#4de7ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="17" y="17" width="478" height="478" rx="111"
        fill="none" stroke="#253447" stroke-width="2"/>

  <!-- subtle forge horizon -->
  <path d="M104 371 Q256 405 408 371"
        fill="none" stroke="url(#cyan)" stroke-width="10"
        stroke-linecap="round" opacity=".85" filter="url(#glow)"/>

  <!-- geometric MergeForge M -->
  <path d="M104 337
           L104 164
           L164 164
           L256 269
           L348 164
           L408 164
           L408 337
           L346 337
           L346 254
           L256 354
           L166 254
           L166 337 Z"
        fill="url(#metal)"/>

  <!-- forged inner cuts -->
  <path d="M166 202 L256 305 L346 202 L346 247 L256 349 L166 247 Z"
        fill="#0a0f17" opacity=".92"/>

  <!-- merge spark -->
  <circle cx="256" cy="130" r="9" fill="#42e7ff" filter="url(#glow)"/>
</svg>
