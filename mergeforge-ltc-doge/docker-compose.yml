services:
  app_proxy:
    environment:
      APP_HOST: mergeforge-ltc-doge_web_1
      APP_PORT: 8096

  init:
    image: ghcr.io/softgamesby/mergeforge-web:0.1.1@sha256:69a57a61859a9a05c551814dcf5102c07ab7325c00b6b270f38c572bc32382fa
    restart: "no"
    user: "0:0"
    network_mode: none
    environment:
      APP_DATA_ROOT: /app-data
    command:
      - python
      - /app/init-config.py
    volumes:
      - ${APP_DATA_DIR}:/app-data
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  litecoin:
    image: ghcr.io/softgamesby/mergeforge-litecoin:0.21.5.8@sha256:141d45221160c11f4cf8e377d958bc4911b0ca83710dd6f639c3b4de8594d8ab
    restart: on-failure
    stop_grace_period: 60s
    init: true
    command:
      - -datadir=/data
      - -conf=/config/litecoin.conf
    volumes:
      - ${APP_DATA_DIR}/config:/config:ro
      - ${APP_DATA_DIR}/data/litecoin:/data
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - litecoin-cli -datadir=/data -conf=/config/litecoin.conf getblockchaininfo >/dev/null 2>&1
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dogecoin:
    image: ghcr.io/softgamesby/mergeforge-dogecoin:1.14.9@sha256:74e1d84794e457b35d1a3eea6ee3bc2d3e4060b9a15b6c860fb39b86a84f752b
    restart: on-failure
    stop_grace_period: 60s
    init: true
    command:
      - -datadir=/data
      - -conf=/config/dogecoin.conf
    volumes:
      - ${APP_DATA_DIR}/config:/config:ro
      - ${APP_DATA_DIR}/data/dogecoin:/data
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - dogecoin-cli -datadir=/data -conf=/config/dogecoin.conf getblockchaininfo >/dev/null 2>&1
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  c2pool:
    image: ghcr.io/softgamesby/mergeforge-c2pool:0.1.0@sha256:0c007199a8c4557ae8ac931997bb123b9245cbaba0f2ed423a36db24a08c1420
    restart: on-failure
    stop_grace_period: 30s
    init: true
    command:
      - /usr/local/bin/c2pool-ltc
      - --config
      - /config/c2pool.yml
      - --log-level
      - info
      - --log-rotation-mb
      - "20"
      - --log-max-mb
      - "100"
      - --dashboard-dir
      - /data
    ports:
      - "3333:3333/tcp"
    volumes:
      - ${APP_DATA_DIR}/config:/config:ro
      - ${APP_DATA_DIR}/data/c2pool:/home/mergeforge/.c2pool
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      init:
        condition: service_completed_successfully
      litecoin:
        condition: service_healthy
      dogecoin:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8080/local_stats >/dev/null 2>&1
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  node_status:
    image: ghcr.io/softgamesby/mergeforge-web:0.1.1@sha256:69a57a61859a9a05c551814dcf5102c07ab7325c00b6b270f38c572bc32382fa
    restart: on-failure
    stop_grace_period: 10s
    init: true
    command:
      - python
      - /app/node-status.py
    environment:
      NODE_STATUS_PORT: "8097"
      CONFIG_DIR: /config
      LITECOIN_RPC_HOST: litecoin
      DOGECOIN_RPC_HOST: dogecoin
    volumes:
      - ${APP_DATA_DIR}/config:/config:ro
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      litecoin:
        condition: service_healthy
      dogecoin:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8097/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  web:
    image: ghcr.io/softgamesby/mergeforge-web:0.1.1@sha256:69a57a61859a9a05c551814dcf5102c07ab7325c00b6b270f38c572bc32382fa
    restart: on-failure
    stop_grace_period: 10s
    init: true
    environment:
      PORT: "8096"
      C2POOL_URL: http://c2pool:8080
      NODE_STATUS_URL: http://node_status:8097
      STRATUM_PORT: "3333"
      APP_VERSION: "0.1.1"
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data/app:/data
    networks:
      - default
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/api/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.37.0/24
